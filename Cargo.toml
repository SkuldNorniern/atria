[workspace]
members = [
    ".",
    "atria-compositor",
    "atria-drm",
    "atria-input",
    "atria-protocol",
    "atria-software-output",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.85"

[package]
name = "atria"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "User-facing facade for the Atria display server"

[dependencies]
atria-compositor = { path = "atria-compositor" }
atria-protocol = { path = "atria-protocol" }
atria-software-output = { path = "atria-software-output" }

[lints]
workspace = true

[workspace.lints.clippy]
absolute_paths = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "warn"
expect_used = "warn"
